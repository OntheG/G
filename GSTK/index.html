<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>God Save The King · GSTK</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#2a121a;
    --maroon-900:#461e29;
    --maroon-800:#5a2734;
    --maroon-700:#6f313f;
    --white:#ffffff;
    --w-90: rgba(255,255,255,.90);
    --w-70: rgba(255,255,255,.70);
    --w-50: rgba(255,255,255,.50);
    --w-30: rgba(255,255,255,.30);
    --w-15: rgba(255,255,255,.15);
    --w-08: rgba(255,255,255,.08);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background:var(--maroon-900);
    color:var(--white);
    font-family:'EB Garamond', 'Times New Roman', serif;
    min-height:100vh;
  }

  /* ── overlay ─────────────────────────────── */
  #fadeOverlay{
    position:fixed; inset:0;
    background:var(--maroon-900);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; pointer-events:none;
    transition:opacity 1s ease;
  }
  #fadeOverlay.fade-out{ opacity:0; }
  #fadeOverlay .ring{
    width:120px; height:120px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:1.1rem;
  }
  #fadeOverlay img{ height:100px; width:auto; }
  #fadeOverlay .rule{
    width:0; height:1px; background:var(--w-50);
    animation:growRule 1.1s ease forwards .3s;
  }
  @keyframes growRule{ to{ width:180px; } }

  /* ── shell ───────────────────────────────── */
  #mainContent{
    opacity:0; transition:opacity .9s ease; transition-delay:.15s;
    max-width:1180px; margin:0 auto;
    padding:2.6rem 1.4rem 3rem;
  }
  #mainContent.visible{ opacity:1; }

  /* ── masthead ────────────────────────────── */
  .masthead{
    text-align:center;
    padding-bottom:1.6rem;
  }
  .masthead .crest{
    width:12px; height:12px; margin:0 auto .9rem;
    display:flex; align-items:center; justify-content:center;
  }
  .masthead .crest img{ height:40px; width:auto; }
  .masthead .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:clamp(2rem, 6vw, 3.1rem);
    letter-spacing:0.06em;
    line-height:1.05;
  }
  .masthead .subline{
    margin-top:.5rem;
    font-style:italic;
    font-size:.95rem;
    color:var(--w-70);
    letter-spacing:.03em;
  }
  .rule-double{
    margin:1.5rem auto 0;
    max-width:520px;
    height:5px;
    border-top:1px solid var(--w-30);
    border-bottom:1px solid var(--w-15);
  }

  /* ── nav (button tiles) ──────────────────── */
  nav.directory-nav{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:.9rem;
    margin:1.9rem 0 2.8rem;
  }
  @media (max-width:640px){
    nav.directory-nav{ grid-template-columns:repeat(2, 1fr); }
  }
  nav.directory-nav a{
    color:var(--white);
    text-decoration:none;
    font-family:'Cormorant Garamond', serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.55rem;
    padding:1.3rem .8rem;
    border:1px solid var(--w-30);
    background:var(--w-08);
    letter-spacing:.04em;
    font-size:1rem;
    text-align:center;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  nav.directory-nav a svg{
    width:22px; height:22px;
    stroke:var(--white);
    fill:none;
    stroke-width:1.4;
  }
  nav.directory-nav a:hover{
    background:var(--w-15);
    border-color:var(--w-50);
    transform:translateY(-2px);
  }
  nav.directory-nav a:active{ transform:translateY(0); }

  /* ── section heading ────────────────────── */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:.5rem;
    border-bottom:1px solid var(--w-15);
    padding-bottom:.6rem; margin-bottom:1.4rem;
  }
  .section-head h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:1.5rem;
    letter-spacing:.03em;
  }
  .section-head .count{
    font-size:.8rem; font-style:italic; color:var(--w-50);
  }

  /* ── register grid ───────────────────────── */
  .register{
    display:grid; grid-template-columns:1fr;
    gap:1.6rem;
  }
  @media (min-width:860px){
    .register{ grid-template-columns:1.55fr 1fr; align-items:start; }
  }

  .map-frame{
    position:relative;
    border:1px solid var(--w-30);
    padding:6px;
  }
  .map-frame::before{
    content:'';
    position:absolute; inset:0;
    border:1px solid var(--w-15);
    margin:2px;
    pointer-events:none;
  }
  .map-frame #map{
    height:400px;
    filter:sepia(.15) saturate(.6) hue-rotate(310deg) brightness(.85);
  }
  @media (max-width:480px){ .map-frame #map{ height:280px; } }

  .map-caption{
    text-align:center; font-size:.72rem; font-style:italic;
    color:var(--w-50); margin-top:.5rem; letter-spacing:.03em;
  }

  /* ── ledger list ─────────────────────────── */
  .ledger{
    border-top:1px solid var(--w-15);
    max-height:460px; overflow-y:auto;
  }
  .ledger::-webkit-scrollbar{ width:3px; }
  .ledger::-webkit-scrollbar-thumb{ background:var(--w-30); }

  .entry{
    display:grid;
    grid-template-columns:1.4rem 1fr;
    gap:.7rem;
    padding:.65rem 0;
    border-bottom:1px solid var(--w-08);
    cursor:pointer;
    transition:background .15s ease, padding-left .15s ease;
    align-items:start;
  }
  .entry:hover{ background:var(--w-08); }
  .entry.active{
    background:var(--w-08);
    box-shadow: inset 3px 0 0 var(--white);
    padding-left:.3rem;
  }
  .entry .mark{
    padding-top:.2rem;
  }
  .entry .mark svg{
    width:15px; height:15px;
    stroke:var(--w-50);
    fill:none;
    stroke-width:1.4;
  }
  .entry.active .mark svg{ stroke:var(--white); }
  .entry .name{
    font-size:.92rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  .entry .addr{
    font-size:.76rem;
    font-style:italic;
    color:var(--w-70);
    margin-top:.1rem;
  }

  /* ── footer ──────────────────────────────── */
  .colophon{
    margin-top:3rem;
    padding-top:1rem;
    border-top:1px solid var(--w-15);
    text-align:center;
    font-size:.72rem;
    font-style:italic;
    letter-spacing:.04em;
    color:var(--w-30);
  }
</style>
</head>
<body>

<div id="fadeOverlay">
  <div class="ring"><img src="https://ontheg.github.io/G/GSTK/Logo.png" alt="GSTK" /></div>
  <div class="rule"></div>
</div>

<div id="mainContent">

  <header class="masthead">
    <div class="crest"><img src="https://ontheg.github.io/G/GSTK/Logo.png" alt="GSTK crest" /></div>
    <div class="wordmark">God Save The King</div>
    <div class="rule-double"></div>
  </header>

  <nav class="directory-nav">
    <a href="About.html">
      <svg viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-7h6v7"/></svg>
      About us
    </a>
    <a href="ID.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="12" r="2"/><path d="M13 10.5h5M13 14h5"/></svg>
      ID Card
    </a>
    <a href="GBP.html">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7.5c0-1.9 1.8-3.2 4-3.2s4 1.3 4 3.2c0 3.6-8 3-8 7 0 2 2 3.4 4.5 3.4S17 16.6 17 15"/></svg>
      GBP Bank
    </a>
    <a href="CP.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
      Contact us
    </a>
  </nav>

  <section>
    <div class="section-head">
      <h2>Register of Residences</h2>
    </div>

    <div class="register">
      <div>
        <div class="map-frame"><div id="map"></div></div>
        <div class="map-caption">Marked residences across England, Scotland &amp; Wales</div>
      </div>

      <div class="ledger" id="ledgerList"></div>
    </div>
  </section>

  <div class="colophon">©GSTK, 2026 — For roleplay purpose only</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  (function(){
    const overlay = document.getElementById('fadeOverlay');
    const main = document.getElementById('mainContent');
    setTimeout(() => {
      overlay.classList.add('fade-out');
      main.classList.add('visible');
      setTimeout(() => { overlay.style.display = 'none'; }, 1100);
    }, 2600);
  })();

  const locationData = {
    0:{lat:51.572346,lon:-0.163262,name:'Gathur D. Kafka',addr:'The Kafka Family Estate, Hampstead Lane, London'},
    1:{lat:51.5770,lon:-0.0140,name:'Alexandre A. Arenberg',addr:'27 Boundary Road, London, E17 8NQ'},
    2:{lat:51.5015,lon:-0.1600,name:'Bernadette M. Hsu',addr:'Knightsbridge, London, SW1X 9PX'},
    3:{lat:51.3810,lon:-2.3590,name:'Blaise A. E. Seymour',addr:'Batstone Close, Bath, Somerset'},
    4:{lat:51.3830,lon:-2.3570,name:'Blake A. l. Seymour',addr:'Claremont Walk, Bath, Somerset'},
    5:{lat:51.5025,lon:-0.2050,name:'Catherine Sinclair',addr:'6A Aubrey Road, Holland Park, London'},
    6:{lat:51.5190,lon:-0.1260,name:'Al P. Winterbourne',addr:'45 Bedford Place, Bloomsbury, London'},
    7:{lat:51.5060,lon:-0.0850,name:'Cordelia Marygold',addr:'Colour House, 7 Bell Yard Mews, London'},
    8:{lat:51.5250,lon:-0.0990,name:'Ethan Kang',addr:'1 Bollinder Place, London, EC1V 2AG'},
    9:{lat:51.5580,lon:-0.1760,name:'Frederick L. Rutherford',addr:'Redington Road, Hampstead, London'},
    10:{lat:51.5200,lon:-0.1450,name:'Laluna H. Satwika',addr:'The Armitage, 218 Great Portland St, London'},
    11:{lat:51.4420,lon:-2.7590,name:'Lareina T. Clarendon',addr:'1A Mayfair Ave, Nailsea, Bristol'},
    12:{lat:51.4980,lon:-0.1550,name:'Noah R. Wilson',addr:'24 Eaton Square, Belgravia, London'},
    13:{lat:51.4790,lon:-0.6300,name:'Saoirse G. Hawthorre',addr:'Drift Road, Windsor, Berkshire'},
    14:{lat:53.3811,lon:-1.4700,name:'Tanner A. Clarendon',addr:'127 Westminster Ave, Sheffield S10 4ER'},
    15:{lat:51.5500,lon:0.0500,name:'Wes V. Chrestien',addr:'130 Elmbridge, London, AP6 5KP'},
    16:{lat:55.9533,lon:-3.1883,name:'Justice Goode',addr:'New Eidyn, Edinburgh, EH1 3SS'}
  };

  // build ledger rows (sorted by name), each marked with a location pin icon instead of a number
  const ledger = document.getElementById('ledgerList');
  const pinSVG = `<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.1-6.5-11A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/></svg>`;
  const ids = Object.keys(locationData).sort((a,b) => locationData[a].name.localeCompare(locationData[b].name));
  ids.forEach((id) => {
    const d = locationData[id];
    const row = document.createElement('div');
    row.className = 'entry';
    row.dataset.id = id;
    row.onclick = () => zoomToLocation(id);
    row.innerHTML = `<span class="mark">${pinSVG}</span>
      <div><div class="name">${d.name}</div><div class="addr">${d.addr}</div></div>`;
    ledger.appendChild(row);
  });

  const map = L.map('map', { zoomControl: true }).setView([54.0, -3.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const markerIcon = L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:#fff;border:2px solid #461e29;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,
    iconSize: [14,14],
    iconAnchor: [7,14],
    popupAnchor: [0,-14]
  });

  const markers = {};
  Object.keys(locationData).forEach(id => {
    const d = locationData[id];
    markers[id] = L.marker([d.lat, d.lon], { icon: markerIcon })
      .bindPopup(`<b>${d.name}</b>`)
      .addTo(map);
  });

  function zoomToLocation(id){
    const d = locationData[id];
    if(!d) return;
    document.querySelectorAll('.entry').forEach(el => el.classList.remove('active'));
    const row = document.querySelector(`.entry[data-id="${id}"]`);
    if(row) row.classList.add('active');
    map.setView([d.lat, d.lon], 15, { animate:true, duration:.8 });
    setTimeout(() => { if(markers[id]) markers[id].openPopup(); }, 400);
    document.querySelector('.map-frame').scrollIntoView({ behavior:'smooth', block:'center' });
  }
</script>
</body>
</html>
